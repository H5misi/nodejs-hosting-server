<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Static File Not Found</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .card {
            padding: 40px;
            text-align: center;

            background: white;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #dc3545;
        }

        p {
            color: #666;
        }

</head>

<body>
    <div class="card">
        <h1>Static File Not Found</h1>

        <p>
            The static file you're looking for doesn't exist.
        </p>
    </div>
