services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"


  nginx:
    image: nginx:1.30
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/usr/share/nginx/html:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro