<!DOCTYPE html>
<html>
<head>
    <title>Static File</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding-top: 100px;
        }

        .message {
            display: inline-block;
            padding: 20px 30px;
            background: white;
            border-radius: 8px;
