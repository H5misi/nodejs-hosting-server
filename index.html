<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Node.js App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;

            text-align: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 20px;

            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Hello from Node.js 🚀</h1>

        <p id="message">
            This page is served by the Node.js backend.
        </p>

        <button onclick="getBackendMessage()">
            Click me
        </button>
    </div>

    <script>
        async function getBackendMessage() {
            const message = document.getElementById("message");

            message.textContent = "Calling backend...";

            try {
                const response = await fetch("/message");

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                message.textContent = data.message;

                console.log("Backend response:", data);
            } catch (error) {
                console.error("Backend error:", error);
                message.textContent = "Failed to contact backend.";
            }
        }
    </script>

</body>
</html>
